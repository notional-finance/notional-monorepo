query NetworkTransactionHistory($skip: Int!) {
  profitLossLineItems(
    orderBy: timestamp
    orderDirection: desc
    skip: $skip
    first: 1000
  ) {
    timestamp
    blockNumber
    transactionHash
    lineItemType
    token {
      id
    }
    underlyingToken {
      id
    }
    tokenAmount
    underlyingAmountRealized
    underlyingAmountSpot
    realizedPrice
    spotPrice
    impliedFixedRate
  }
}
