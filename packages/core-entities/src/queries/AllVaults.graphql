query AllVaults($skip: Int) {
  vaults(first: 1000, skip: $skip) {
    id
    isWhitelisted
    asset {
      id
    }
    yieldToken {
      id
    }
    vaultToken {
      id
    }

    feeRate
    strategyType

    withdrawRequestManagers {
      id
    }
  }

  _meta {
    block {
      number
    }
  }
}
