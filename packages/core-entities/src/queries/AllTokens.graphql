query AllTokens($skip: Int) {
  tokens(first: 1000, skip: $skip) {
    id
    tokenType
    tokenInterface
    underlying {
      id
    }
    name
    symbol
    decimals
    totalSupply
    maturity
    vaultAddress {
      id
    }
    tokenAddress
    totalSupply
  }

  _meta {
    block {
      number
    }
  }
}
