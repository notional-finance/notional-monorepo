query AllVaultAccounts($blockNumber: Int!, $vaultAddress: Bytes!, $skip: Int) {
  balances(
    where: {
      token_: { vaultAddress: $vaultAddress, tokenType: VaultShare }
      current_: { currentBalance_not: 0 }
    }
    block: { number: $blockNumber }
    first: 1000
    skip: $skip
  ) {
    id
    account {
      id
    }
    current {
      currentBalance
    }
  }
}
