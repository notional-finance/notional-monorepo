query HistoricalOracleValues($skip: Int, $minTimestamp: Timestamp) {
  oracles(where: { matured: false }, first: 1000, skip: $skip) {
    id
    base {
      id
      tokenType
    }
    quote {
      id
      tokenType
      maturity
      underlying {
        id
      }
    }
    decimals
    ratePrecision
    oracleAddress
    oracleType
    latestRate
    historicalRates(
      where: { timestamp_gt: $minTimestamp }
      orderBy: timestamp
      orderDirection: desc
      first: 500
    ) {
      totalSupply
      blockNumber
      timestamp
      rate
    }
  }

  _meta {
    block {
      number
    }
  }
}
