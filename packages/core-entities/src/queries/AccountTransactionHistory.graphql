query AccountTransactionHistory($accountId: String!, $skip: Int!) {
  profitLossLineItems(
    where: { account: $accountId }
    orderBy: timestamp
    orderDirection: desc
    skip: $skip
    first: 1000
  ) {
    timestamp
    blockNumber
    transactionHash
    lineItemType
    account {
      id
    }
    token {
      id
    }
    underlyingToken {
      id
    }
    tokenAmount
    underlyingAmountRealized
    underlyingAmountSpot
    realizedPrice
    spotPrice
    impliedFixedRate
    yieldTokenAmount
    balanceSnapshot {
      balance {
        token {
          vaultAddress
        }
      }
    }
  }
}
