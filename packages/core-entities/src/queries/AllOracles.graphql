query AllOracles($skip: Int!) {
  oracles(
    where: {
      oracleType_in: [
        Chainlink
        fCashOracleRate
        fCashSettlementRate
        PrimeCashToUnderlyingExchangeRate
        PrimeDebtToUnderlyingExchangeRate
        VaultShareOracleRate
        nTokenToUnderlyingExchangeRate
        fCashSpotRate
        nTokenFeeRate
        VaultShareInterestAccrued
        nTokenInterestAccrued
      ]
      matured: false
    }
    first: 1000
    skip: $skip
  ) {
    id
    lastUpdateBlockNumber
    lastUpdateTimestamp
    base {
      id
      decimals
    }
    quote {
      id
      currencyId
    }
    decimals
    oracleAddress
    oracleType
    mustInvert
    latestRate
  }

  _meta {
    block {
      number
    }
  }
}
