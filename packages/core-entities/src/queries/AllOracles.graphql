query AllOracles($skip: Int!) {
  oracles(where: { matured: false }, first: 1000, skip: $skip) {
    id
    lastUpdateBlockNumber
    lastUpdateTimestamp
    base {
      id
      decimals
    }
    quote {
      id
      decimals
    }
    decimals
    oracleAddress
    oracleType
    mustInvert
    latestRate
  }

  _meta {
    block {
      number
    }
  }
}
